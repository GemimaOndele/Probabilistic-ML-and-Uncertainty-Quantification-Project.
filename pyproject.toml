[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "probabilistic-ml-uq"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
description = "Shared contracts for image classification uncertainty experiments"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
