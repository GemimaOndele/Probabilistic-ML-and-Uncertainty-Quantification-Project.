name: CI
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
      - run: python -m compileall -q .
      - run: |
          if [ -d tests ]; then python -m pytest tests; else echo 'Tests applicatifs non encore disponibles'; fi
